# Add this location inside your existing HTTPS server block.
# Set TRUST_PROXY_HOPS=1 when Nginx is the only proxy and the API binds to localhost.
location /sfc-cmr/ {
    proxy_pass http://127.0.0.1:3015/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# If the frontend uses https://<host>/paddyapi as its API base, map that
# prefix to the backend's /api/v1 routes. The backend handles CORS preflight.
location /paddyapi/ {
    proxy_pass http://127.0.0.1:3015/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 2m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
